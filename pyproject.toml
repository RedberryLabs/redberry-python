[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redberry-sdk"
dynamic = ["version"]
description = "Records an AI agent's model and tool calls with OpenTelemetry and sends them to the customer's Redberry install."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Redberry Labs" }]
requires-python = ">=3.11"
keywords = ["opentelemetry", "ai agents", "llm", "observability", "redberry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "requests>=2.31",
    "wrapt>=1.16",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
providers = [
    "opentelemetry-instrumentation-openai-v2>=2.0b0,<2.4",
    "httpx>=0.27",
    "wrapt>=1.17,<2",
    "openinference-instrumentation-anthropic>=0.1",
    "opentelemetry-instrumentation-bedrock>=0.60",
    "opentelemetry-instrumentation-cohere>=0.60",
    "opentelemetry-instrumentation-mistralai>=0.60",
    "opentelemetry-instrumentation-ollama>=0.60",
    "opentelemetry-instrumentation-vertexai>=0.60",
    "opentelemetry-instrumentation-google-generativeai>=0.60",
    "openinference-instrumentation-google-genai>=1.4",
    "opentelemetry-instrumentation-groq>=0.60",
    "opentelemetry-instrumentation-together>=0.60",
    "opentelemetry-instrumentation-replicate>=0.60",
]
frameworks = [
    "opentelemetry-instrumentation-langchain>=0.1",
    "opentelemetry-instrumentation-llamaindex>=0.60",
    "opentelemetry-instrumentation-crewai>=0.60",
    "opentelemetry-instrumentation-haystack>=0.60",
    # 2.7 no longer exports the span of a tool call paused for approval
    "openinference-instrumentation-openai-agents>=2.0,<2.6",
]
vectordb = [
    "opentelemetry-instrumentation-chromadb>=0.60",
    "opentelemetry-instrumentation-pinecone>=0.60",
    "opentelemetry-instrumentation-qdrant>=0.60",
    "opentelemetry-instrumentation-weaviate>=0.60",
]
openai-agents = ["openai-agents>=0.22"]
hasher = ["cryptography>=42"]
all = ["redberry-sdk[providers,frameworks,vectordb]"]
dev = ["cryptography>=42", "pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27", "respx>=0.21", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/RedberryLabs/redberry-python"
Source = "https://github.com/RedberryLabs/redberry-python"
Changelog = "https://github.com/RedberryLabs/redberry-python/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "redberry_sdk._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["redberry_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F811"]  # pytest fixtures imported and then used as arguments
